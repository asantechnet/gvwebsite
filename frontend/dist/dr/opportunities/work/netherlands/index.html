    <script>
      (() => {
        const publishedBranding = null /*__GLOBALVISION_PUBLISHED_BRANDING__*/
        const validBrandColor = (value) => /^#[0-9a-f]{6}$/i.test(value || '') ? value.toUpperCase() : null
        const primary = validBrandColor(publishedBranding?.primary) || validBrandColor(window.localStorage.getItem('globalvision-brand-primary'))
        const secondary = validBrandColor(publishedBranding?.secondary) || validBrandColor(window.localStorage.getItem('globalvision-brand-secondary'))
        if (primary) {
          document.documentElement.style.setProperty('--brand-orange', primary)
          window.localStorage.setItem('globalvision-brand-primary', primary)
        }
        if (secondary) {
          document.documentElement.style.setProperty('--brand-red', secondary)
          window.localStorage.setItem('globalvision-brand-secondary', secondary)
        }

        const isDashboard = window.location.pathname === '/dashboard' || window.location.pathname.startsWith('/dashboard/')
        const theme = window.localStorage.getItem('globalvision-theme') || 'light'
        document.title = ''
        document.documentElement.dataset.application = isDashboard ? 'cms' : 'website'
        document.documentElement.classList.add(theme === 'dark' ? 'dark' : 'light')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', isDashboard
          ? theme === 'dark' ? '#0a1019' : '#edf1f6'
          : theme === 'dark' ? '#1f2937' : '#fffaf5')

        if (isDashboard) {
          const savedLanguage = window.sessionStorage.getItem('globalvision-language')
          const language = ['prs', 'ps', 'en'].includes(savedLanguage) ? savedLanguage : 'prs'
          document.documentElement.dataset.language = language
          document.documentElement.lang = language
          document.documentElement.dir = language === 'en' ? 'ltr' : 'rtl'
        } else {
          if ('scrollRestoration' in window.history) window.history.scrollRestoration = 'manual'
          const navigationType = window.performance.getEntriesByType('navigation')[0]?.type
          if (navigationType === 'reload') {
            try {
              const scrollKey = `globalvision-scroll:${window.location.pathname}${window.location.search}`
              const storedScroll = window.sessionStorage.getItem(scrollKey)
              const parsedScroll = storedScroll ? JSON.parse(storedScroll) : null
              const savedTop = typeof parsedScroll === 'number' ? parsedScroll : Number(parsedScroll?.top)
              if (Number.isFinite(savedTop) && savedTop > 0) {
                document.documentElement.dataset.restoringScroll = 'true'
                document.documentElement.style.minHeight = `${Math.ceil(savedTop + window.innerHeight)}px`
                const restoreBeforePaint = () => window.scrollTo({ top: savedTop, behavior: 'auto' })
                restoreBeforePaint()
                window.addEventListener('DOMContentLoaded', restoreBeforePaint, { once: true })
                if (Number.isInteger(parsedScroll?.sectionIndex) && Number.isFinite(parsedScroll?.sectionProgress)) {
                  const observer = new MutationObserver(() => {
                    const section = document.querySelectorAll('[data-route-skeleton] > section')[parsedScroll.sectionIndex]
                    if (!section) return
                    window.scrollTo(0, section.getBoundingClientRect().top + window.scrollY + (parsedScroll.sectionProgress * section.offsetHeight))
                    observer.disconnect()
                  })
                  observer.observe(document.documentElement, { childList: true, subtree: true })
                }
                window.__globalVisionScrollRestoreFallback = window.setTimeout(() => {
                  restoreBeforePaint()
                  delete document.documentElement.dataset.restoringScroll
                  document.documentElement.style.removeProperty('min-height')
                }, 5000)
              }
            } catch {
              delete document.documentElement.dataset.restoringScroll
              document.documentElement.style.removeProperty('min-height')
            }
          }

          const possibleLanguage = window.location.pathname.split('/')[1]
          const language = ['dr', 'ps', 'en'].includes(possibleLanguage) ? possibleLanguage : 'dr'
          const languageSettings = {
            dr: { htmlLang: 'fa-AF', direction: 'rtl' },
            ps: { htmlLang: 'ps-AF', direction: 'rtl' },
            en: { htmlLang: 'en', direction: 'ltr' },
          }[language]

          document.documentElement.dataset.language = language
          document.documentElement.lang = languageSettings.htmlLang
          document.documentElement.dir = languageSettings.direction

        }
      })()
    </script>
