    <style>html,body{background:#fffaf5}html.dark,html.dark body{background:#1f2937}html[data-application=cms],html[data-application=cms] body{background:#edf1f6}html[data-application=cms].dark,html[data-application=cms].dark body{background:#0a1019}</style>
    <script>
      (() => {
        const isDashboard = window.location.pathname === '/dashboard' || window.location.pathname.startsWith('/dashboard/')
        const theme = window.localStorage.getItem('globalvision-theme') || 'light'
        document.documentElement.dataset.application = isDashboard ? 'cms' : 'website'
        document.documentElement.classList.add(theme === 'dark' ? 'dark' : 'light')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', isDashboard
          ? theme === 'dark' ? '#0a1019' : '#edf1f6'
          : theme === 'dark' ? '#1f2937' : '#fffaf5')

        if (isDashboard) {
          const savedLanguage = window.sessionStorage.getItem('globalvision-language')
          const language = ['prs', 'ps', 'en'].includes(savedLanguage) ? savedLanguage : 'prs'
          document.documentElement.dataset.language = language
          document.documentElement.lang = language
          document.documentElement.dir = language === 'en' ? 'ltr' : 'rtl'
        } else {
          const possibleLanguage = window.location.pathname.split('/')[1]
          const language = ['dr', 'ps', 'en'].includes(possibleLanguage) ? possibleLanguage : 'dr'
          const languageSettings = {
            dr: { htmlLang: 'fa-AF', direction: 'rtl' },
            ps: { htmlLang: 'ps-AF', direction: 'rtl' },
            en: { htmlLang: 'en', direction: 'ltr' },
          }[language]

          document.documentElement.dataset.language = language
          document.documentElement.lang = languageSettings.htmlLang
          document.documentElement.dir = languageSettings.direction

          const titles = {
            dr: {
              brand: 'گلوبل ویژن',
              pages: { home: 'صفحه اصلی', about: 'در باره ما', contact: 'تماس با ما', services: 'خدمات', scholarships: 'بورسیه‌ها', magazine: 'مجله', search: 'جستجو', study: 'فرصت های تحصیلی', work: 'فرصت های کاری', migration: 'فرصت های مهاجرت', investment: 'فرصت های سرمایه گذاری', tourismAfghanistan: 'سیاحت در افغانستان', tourismWorld: 'سیاحت در جهان' },
            },
            ps: {
              brand: 'ګلوبل ویژن',
              pages: { home: 'اصلي پاڼه', about: 'زموږ په اړه', contact: 'له موږ سره اړیکه', services: 'خدمتونه', scholarships: 'بورسیې', magazine: 'مجله', search: 'لټون', study: 'تحصیلي فرصتونه', work: 'کاري فرصتونه', migration: 'د مهاجرت فرصتونه', investment: 'د پانګونې فرصتونه', tourismAfghanistan: 'په افغانستان کې سیاحت', tourismWorld: 'په نړۍ کې سیاحت' },
            },
            en: {
              brand: 'Global Vision',
              pages: { home: 'Home', about: 'About Us', contact: 'Contact Us', services: 'Services', scholarships: 'Scholarships', magazine: 'Magazine', search: 'Search', study: 'Study Opportunities', work: 'Work Opportunities', migration: 'Migration Opportunities', investment: 'Investment Opportunities', tourismAfghanistan: 'Tourism in Afghanistan', tourismWorld: 'Tourism Around the World' },
            },
          }
          const pagePath = `/${window.location.pathname.split('/').slice(2).filter(Boolean).join('/')}`
          const pageKey = pagePath === '/' ? 'home'
            : pagePath === '/about' ? 'about'
              : pagePath === '/contact' ? 'contact'
                : pagePath.startsWith('/services') ? 'services'
                  : pagePath.startsWith('/scholarships') ? 'scholarships'
                    : pagePath.startsWith('/magazine') ? 'magazine'
                      : pagePath === '/search' ? 'search'
                        : pagePath.startsWith('/opportunities/study') ? 'study'
                          : pagePath.startsWith('/opportunities/work') ? 'work'
                            : pagePath.startsWith('/opportunities/migration') ? 'migration'
                              : pagePath.startsWith('/opportunities/investment') ? 'investment'
                                : pagePath.startsWith('/tourism/afghanistan') ? 'tourismAfghanistan'
                                  : pagePath.startsWith('/tourism/world') ? 'tourismWorld'
                                    : 'home'
          const titleContent = titles[language]
          document.title = `${titleContent.pages[pageKey]} | ${titleContent.brand}`
        }
      })()
    </script>
